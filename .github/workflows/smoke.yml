# End-to-end smoke check: one Render service now serves both the web client
# and the API. Runs after every push so a broken deploy is visible in
# Actions without anyone having to open the site.
name: Smoke check

on:
  push:
    branches: [claude/new-session-h91lyu, main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: API is healthy
        run: |
          # Retry for up to ~5 minutes: the push that triggered this also
          # triggers a Render rebuild, which now includes the web build.
          for i in $(seq 1 20); do
            curl -sS -m 30 https://lumnia-api-lkfg.onrender.com/v1/health -o health.json || true
            if python3 -c "import json;d=json.load(open('health.json'));assert d.get('ok') is True" 2>/dev/null; then
              echo "api ok: $(cat health.json)"; exit 0
            fi
            echo "attempt $i: not healthy yet, waiting 15s"; sleep 15
          done
          echo "API never became healthy"; cat health.json; exit 1
      - name: Web client served from the same origin
        run: |
          code=$(curl -sS -o page.html -w "%{http_code}" -L https://lumnia-api-lkfg.onrender.com/)
          echo "site status: $code"
          grep -o "<title>[^<]*</title>" page.html || true
          test "$code" = "200"
          grep -qi "lumnia" page.html
          echo "asset bundle served:"
          grep -o 'assets/index-[^"]*\.js' page.html | head -1
      - uses: actions/checkout@v4
      - name: Every analysis this repo defines is live
        env:
          TOKEN: ${{ secrets.LUMNIA_ADMIN_TOKEN }}
          API: https://lumnia-api-lkfg.onrender.com/v1
        run: |
          # "Deployed" means the running service can do what the code says,
          # not that a push succeeded. Compare the live registry against the
          # module list in this commit.
          if [ -z "$TOKEN" ]; then echo "no token - skipping registry check"; exit 0; fi
          curl -sS -m 30 "$API/studio/modules" -H "Authorization: Bearer $TOKEN" -o live.json
          python3 - <<'PY'
          import json, re, sys, pathlib
          src = pathlib.Path("api/app/pipeline/modules.py").read_text()
          want = set(re.findall(r'name="([a-z-]+)",\n\s+version=', src))
          live = {m["name"] for m in json.load(open("live.json"))}
          missing = sorted(want - live)
          print("defined:", len(want), "| live:", len(live))
          if missing:
              print("NOT DEPLOYED:", missing); sys.exit(1)
          print("all analyses live:", ", ".join(sorted(live)))
          PY
      - name: The link a stakeholder receives still opens the report
        env:
          TOKEN: ${{ secrets.LUMNIA_ADMIN_TOKEN }}
          API: https://lumnia-api-lkfg.onrender.com/v1
        run: |
          # The portal link is the one thing handed to a client, so it is the
          # one thing worth checking end to end: fetch it exactly as a reader
          # would, with only the key, and assert a published report comes back.
          # Keys are masked — this log is public.
          if [ -z "$TOKEN" ]; then echo "no token - skipping portal check"; exit 0; fi
          curl -sS -m 30 "$API/studio/orgs" -H "Authorization: Bearer $TOKEN" -o orgs.json
          org=$(python3 -c "import json;o=json.load(open('orgs.json'));print(o[0]['id'] if o else '')")
          key=$(python3 -c "import json;o=json.load(open('orgs.json'));print(o[0]['share_key'] if o else '')")
          if [ -z "$org" ]; then echo "no clients yet - nothing to share"; exit 0; fi
          echo "::add-mask::$key"
          code=$(curl -sS -o portal.json -w "%{http_code}" -m 30 "$API/portal/$org?k=$key")
          test "$code" = "200"
          python3 - <<'PY'
          import json
          p = json.load(open("portal.json"))
          reps = p["reports"]
          print("portal opens for:", p["org"]["name"], "|", len(reps), "report(s)")
          for r in reps:
              # Titles and ids are safe to print; share keys are not.
              print("  -", r["id"], "|", r["title"].get("fr") or r["title"].get("en"))
          assert reps, "portal opens but lists no published report"
          PY

      - name: The deployed build is the current one
        run: |
          # "It looks the same" is usually a stale deploy or a cached page.
          # Assert against the API's own route list, which cannot be cached
          # by a browser: the ask surface exists only in the current build.
          curl -sS -m 30 https://lumnia-api-lkfg.onrender.com/openapi.json -o api.json
          python3 - <<'PY'
          import json, sys
          spec = json.load(open("api.json"))
          paths = set(spec.get("paths", {}))
          want = ["/v1/studio/ask", "/v1/studio/orgs/{org_id}/tiles",
                  "/v1/studio/orgs/{org_id}/timeline", "/v1/studio/dashboard"]
          missing = [p for p in want if p not in paths]
          if missing:
              print("stale deploy - missing routes:", missing)
              print("deployed routes:", sorted(paths))
              sys.exit(1)
          print("current build deployed; ask surface live")
          PY
