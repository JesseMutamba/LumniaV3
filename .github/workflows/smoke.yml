# End-to-end smoke check: one Render service now serves both the web client
# and the API. Runs after every push so a broken deploy is visible in
# Actions without anyone having to open the site.
name: Smoke check

on:
  push:
    branches: [claude/new-session-h91lyu, main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: API is healthy
        run: |
          # Retry for up to ~5 minutes: the push that triggered this also
          # triggers a Render rebuild, which now includes the web build.
          for i in $(seq 1 20); do
            curl -sS -m 30 https://lumnia-api-lkfg.onrender.com/v1/health -o health.json || true
            if python3 -c "import json;d=json.load(open('health.json'));assert d.get('ok') is True" 2>/dev/null; then
              echo "api ok: $(cat health.json)"; exit 0
            fi
            echo "attempt $i: not healthy yet, waiting 15s"; sleep 15
          done
          echo "API never became healthy"; cat health.json; exit 1
      - name: Web client served from the same origin
        run: |
          code=$(curl -sS -o page.html -w "%{http_code}" -L https://lumnia-api-lkfg.onrender.com/)
          echo "site status: $code"
          grep -o "<title>[^<]*</title>" page.html || true
          test "$code" = "200"
          grep -qi "lumnia" page.html
          echo "asset bundle served:"
          grep -o 'assets/index-[^"]*\.js' page.html | head -1
      - uses: actions/checkout@v4
      - name: Every analysis this repo defines is live
        env:
          TOKEN: ${{ secrets.LUMNIA_ADMIN_TOKEN }}
          API: https://lumnia-api-lkfg.onrender.com/v1
        run: |
          # "Deployed" means the running service can do what the code says,
          # not that a push succeeded. Compare the live registry against the
          # module list in this commit.
          if [ -z "$TOKEN" ]; then echo "no token - skipping registry check"; exit 0; fi
          curl -sS -m 30 "$API/studio/modules" -H "Authorization: Bearer $TOKEN" -o live.json
          python3 - <<'PY'
          import json, re, sys, pathlib
          src = pathlib.Path("api/app/pipeline/modules.py").read_text()
          want = set(re.findall(r'name="([a-z-]+)",\n\s+version=', src))
          live = {m["name"] for m in json.load(open("live.json"))}
          missing = sorted(want - live)
          print("defined:", len(want), "| live:", len(live))
          if missing:
              print("NOT DEPLOYED:", missing); sys.exit(1)
          print("all analyses live:", ", ".join(sorted(live)))
          PY
      - name: The link a stakeholder receives still opens the report
        env:
          TOKEN: ${{ secrets.LUMNIA_ADMIN_TOKEN }}
          API: https://lumnia-api-lkfg.onrender.com/v1
        run: |
          # The portal link is the one thing handed to a client, so it is the
          # one thing worth checking end to end: fetch it exactly as a reader
          # would, with only the key, and assert a published report comes back.
          # Keys are masked — this log is public.
          if [ -z "$TOKEN" ]; then echo "no token - skipping portal check"; exit 0; fi
          # A gateway error during Render's swap window is the deploy in
          # progress, not a broken link. Retry those; a 4xx is a real answer
          # and fails immediately. Without this the check cries wolf on every
          # deploy, and a check people learn to ignore is worse than none.
          get() { # get <url> <outfile> [auth]
            for _ in 1 2 3 4 5 6 7 8; do
              if [ "$3" = "auth" ]; then
                c=$(curl -sS -o "$2" -w "%{http_code}" -m 30 "$1" -H "Authorization: Bearer $TOKEN" || echo 000)
              else
                c=$(curl -sS -o "$2" -w "%{http_code}" -m 30 "$1" || echo 000)
              fi
              case "$c" in 000|502|503|504) echo "  $c - deploy in progress, retrying in 15s" >&2; sleep 15;;
                           *) echo "$c"; return 0;; esac
            done
            echo "$c"
          }
          code=$(get "$API/studio/orgs" orgs.json auth)
          test "$code" = "200"
          # Every client, not just the first: an empty client sorted to the top
          # would otherwise be the link that gets handed out.
          python3 -c "import json;[print('::add-mask::'+o['share_key']) for o in json.load(open('orgs.json'))]"
          n=$(python3 -c "import json;print(len(json.load(open('orgs.json'))))")
          if [ "$n" = "0" ]; then echo "no clients yet - nothing to share"; exit 0; fi
          for i in $(seq 0 $((n - 1))); do
            org=$(python3 -c "import json;print(json.load(open('orgs.json'))[$i]['id'])")
            key=$(python3 -c "import json;print(json.load(open('orgs.json'))[$i]['share_key'])")
            code=$(get "$API/portal/$org?k=$key" "portal-$i.json")
            echo "portal $org -> HTTP $code"
            test "$code" = "200"
          done
          python3 - <<'PY'
          import glob, json
          total = 0
          for f in sorted(glob.glob("portal-*.json")):
              p = json.load(open(f))
              reps = p["reports"]
              total += len(reps)
              # Names, ids and titles are safe to print; share keys are not.
              print(f"{p['org']['id']} ({p['org']['name']}): {len(reps)} published report(s)")
              for r in reps:
                  print("   -", r["id"], "|", r["title"].get("fr") or r["title"].get("en"))
          assert total, "every portal opens, but not one published report behind any of them"
          PY

      - name: The deployed build is the current one
        run: |
          # "It looks the same" is usually a stale deploy or a cached page.
          # Assert against the API's own route list, which no browser can
          # cache. The expected routes are read out of this commit rather
          # than listed by hand: a hardcoded list goes stale silently, which
          # is the exact failure this step exists to catch.
          curl -sS -m 30 https://lumnia-api-lkfg.onrender.com/openapi.json -o api.json
          python3 - <<'PY'
          import json, re, sys, pathlib
          want = set()
          for f in pathlib.Path("api/app/routers").glob("*.py"):
              for m in re.finditer(r'@router\.(get|post|put|delete|patch)\(\s*\n?\s*"([^"]+)"',
                                   f.read_text()):
                  want.add("/v1" + m.group(2))
          live = set(json.load(open("api.json")).get("paths", {}))
          missing = sorted(want - live)
          print("defined:", len(want), "| live:", len(live))
          if missing:
              print("STALE DEPLOY - the running service is missing:", missing)
              sys.exit(1)
          print("current build deployed; every route this commit defines answers")
          PY
