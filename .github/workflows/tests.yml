# The gate. Every push runs the suite, including the golden set — the
# numbers this platform is not allowed to get wrong. A change that moves
# one of them fails here, before it reaches a reader.
name: Tests

on:
  push:
    branches: [claude/new-session-h91lyu, main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt
      - name: Golden set — the figures that must not move
        working-directory: api
        run: python -m pytest tests/test_golden.py -q
      - name: Full suite
        working-directory: api
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
