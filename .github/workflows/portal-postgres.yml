name: PostgreSQL portal release gate

on:
  pull_request:
  push:
    branches: [main, feat/lumnia-demo-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lumnia_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: lumnia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumnia_test -d lumnia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # This disposable Actions service is never the production DATABASE_URL.
      # Each PostgreSQL test creates and drops a fresh lumnia_test_<uuid> DB.
      LUMNIA_TEST_POSTGRES_URL: postgresql://lumnia_test:isolated-ci-only@localhost:5432/lumnia_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.lock
      - name: Install the exact production dependencies
        run: python -m pip install -r api/requirements.lock
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Existing API suite plus real PostgreSQL release gates
        working-directory: api
        run: python -m pytest -q
