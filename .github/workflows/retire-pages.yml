# Retires the old GitHub Pages site: replaces it with a page that forwards
# every visitor — hash route and share key intact, since the hash never
# leaves the browser — to the Render origin that now serves the platform.
# One-shot in spirit; safe to re-run.
name: Retire Pages with a redirect

on:
  push:
    branches: [claude/new-session-h91lyu]
    paths:
      - "pages-redirect/**"
      - ".github/workflows/retire-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp pages-redirect/index.html pages-redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
