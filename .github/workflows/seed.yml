# Seeds the live platform: creates the PVAK client and publishes the template
# report. Idempotent — re-running keeps the existing share key. Requires the
# LUMNIA_ADMIN_TOKEN repository secret (Settings > Secrets and variables >
# Actions); without it the job exits quietly so ordinary pushes never fail
# on a missing secret. The optional RENDER_DEPLOY_HOOK secret (the URL from
# the Render service's Settings > Deploy Hook) lets this workflow start the
# deploy it waits for, instead of relying on Render's auto-deploy.
name: Seed first client and report

# Re-runnable at any time — publishing the same report again is a no-op that
# keeps its share key.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed.yml"
      - "api/templates/**"
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Render's auto-deploy can silently stop firing (the GitHub connection
      # breaks, or the toggle is off) while the old instance keeps serving.
      # A deploy hook bypasses that connection entirely: POSTing it starts a
      # deploy of the tracked branch at its latest commit. Copy the URL from
      # the Render service (Settings > Deploy Hook) into the
      # RENDER_DEPLOY_HOOK repository secret and this workflow becomes the
      # whole chain: deploy, wait for the new code, publish.
      - name: Trigger a Render deploy (when the hook secret is set)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set - relying on Render auto-deploy."
            echo "If deploys are not happening, copy the Deploy Hook URL from the"
            echo "Render service (Settings > Deploy Hook) into that secret."
            exit 0
          fi
          # -f: an HTTP error from the hook must fail this step loudly, not
          # print an error body and count as a triggered deploy.
          # The response names the deploy Render created; keep it so a
          # failed wait can point at the exact deploy to open in Events.
          curl -fsS -X POST "$HOOK" | tee deploy.json
          echo
          echo "deploy triggered"
      - name: Create client and publish template report
        env:
          TOKEN: ${{ secrets.LUMNIA_ADMIN_TOKEN }}
          API: https://lumnia-api-lkfg.onrender.com/v1
        run: |
          if [ -z "$TOKEN" ]; then
            echo "LUMNIA_ADMIN_TOKEN secret not set - skipping seed."
            echo "Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 0
          fi
          # Render redeploys on the same push that triggers this workflow —
          # and keeps the OLD version serving until the new one is live, so a
          # bare liveness check answers immediately and the publish below
          # meets an API that predates the template's newest block type.
          # Wait until health advertises every block type the template uses,
          # with a window sized for a full Docker build, not a restart.
          NEEDED=$(python3 -c "
          import json
          print(' '.join(sorted({b['type'] for b in json.load(open('api/templates/report.template.json'))['blocks']})))")
          echo "template needs: $NEEDED"
          READY=no
          for i in $(seq 1 60); do
            if curl -sS -m 20 "$API/health" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          have = set(d.get('block_types', []))
          sys.exit(0 if d.get('ok') and set('$NEEDED'.split()) <= have else 1)" 2>/dev/null; then
              echo "api is up and speaks the template's block types"; READY=yes; break
            fi
            echo "waiting for the new deploy ($i)"; sleep 15
          done
          # Publishing against a deploy that lacks a block type is three
          # guaranteed 422s; diagnose instead, and leave the retry to a
          # re-run once the Render dashboard says why the deploy is absent.
          if [ "$READY" != "yes" ]; then
            echo "The live API never advertised the template's block types."
            echo "It currently serves:"
            curl -sS -m 20 "$API/health" || true
            echo
            if [ -f deploy.json ]; then
              echo "This run asked Render for exactly this deploy, which never went live:"
              cat deploy.json
              echo
            fi
            echo "Open that deploy in the Render dashboard (lumnia-api > Events) —"
            echo "its build log holds the reason — then re-run this workflow."
            exit 1
          fi
          # Create the client; a duplicate is fine, publishing below is the test.
          curl -sS -X POST "$API/orgs" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"id":"pvak","name":"PVAK","sub":{"fr":"Mwebe & Kwenge, RDC","en":"Mwebe & Kwenge, DRC"}}' \
            || true
          echo
          for i in 1 2 3; do
            code=$(curl -sS -o out.json -w "%{http_code}" -X POST "$API/orgs/pvak/reports" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              --data-binary @api/templates/report.template.json)
            echo "publish status: $code"
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then break; fi
            sleep 20
          done
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then cat out.json; exit 1; fi
          # The share key is a bearer credential and these logs are public - mask it.
          KEY=$(python3 -c "import json;print(json.load(open('out.json'))['share_key'])")
          echo "::add-mask::$KEY"
          echo "Published pvak-fy26-q1. Copy the share link from Studio (it holds the key)."
          echo "Platform state now:"
          curl -sS "$API/health"
