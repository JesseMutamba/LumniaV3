# fly launch --no-deploy   then   fly deploy
app = "lumnia-api"
primary_region = "cdg"   # Paris — closest low-latency region to the DRC

[build]
  dockerfile = "Dockerfile"

[env]
  LUMNIA_ORIGINS = "https://lumnia.pages.dev"

[[mounts]]
  source = "lumnia_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
