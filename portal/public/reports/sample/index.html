/* The pillar dots take single-letter modifiers (a/b/c), which share a global
   namespace with the report viewer's block class .b{margin-bottom:40px}. That
   margin pushed the Clarity dot 10px above its own circle while Light and
   Intelligence, having no matching rule, stayed centred. Two class selectors
   outrank one, so this wins wherever it sits in the sheet; flex:none stops the
   dot being squeezed by the flex centring on .ld-mark. */
.ld-mark .ld-dot{margin:0;flex:none}
